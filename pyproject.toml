[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "DjangoServer.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
